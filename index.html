    <div id="legacy-browser-notice">
      RSMChords needs a newer browser — please update to Safari&nbsp;16.2+, iOS&nbsp;16.2+,
      Chrome&nbsp;111+ or Firefox&nbsp;113+ for the app to display correctly.
    </div>
    <div id="root"></div>
    <!--
      Decodes the "?p=" redirect written by public/404.html (see its comment) back into a
      real path before React Router mounts. A harmless no-op outside the GitHub Pages demo,
      where there's never a "?p=" param to find.
    -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirectedPath = params.get('p');
        if (redirectedPath === null) return;
        var restoredQuery = params.get('q');
        var newUrl =
          window.location.pathname.replace(/\/$/, '') +
          '/' + redirectedPath.replace(/~and~/g, '&') +
          (restoredQuery ? '?' + restoredQuery.replace(/~and~/g, '&') : '') +
          window.location.hash;
        window.history.replaceState(null, '', newUrl);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
